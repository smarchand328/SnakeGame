<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Game</title>
    <style>
      :root {
        color-scheme: dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1020;
        color: #e2e8f0;
        font-family: Arial, sans-serif;
      }

      .game-shell {
        text-align: center;
        padding: 1.25rem;
        border-radius: 12px;
        background: #111827;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
      }

      h1 {
        margin-top: 0;
        margin-bottom: 0.5rem;
        font-size: 1.4rem;
      }

      .stats {
        display: flex;
        justify-content: space-between;
        gap: 1.5rem;
        margin-bottom: 0.75rem;
        font-size: 0.95rem;
      }

      #game {
        border: 2px solid #334155;
        background: #020617;
        display: block;
        margin-inline: auto;
      }

      .hint {
        margin-top: 0.75rem;
        margin-bottom: 0;
        color: #94a3b8;
        font-size: 0.85rem;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <h1>Snake</h1>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>High Score: <strong id="high-score">0</strong></span>
      </div>
      <canvas id="game" width="400" height="400" aria-label="Snake game board"></canvas>
      <p class="hint">Use arrow keys or WASD. Press Space to restart after game over.</p>
    </main>

    <script>
      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const scoreEl = document.getElementById("score");
      const highScoreEl = document.getElementById("high-score");

      const gridSize = 20;
      const tileSize = canvas.width / gridSize;
      let snake;
      let direction;
      let nextDirection;
      let food;
      let score;
      let highScore = Number(localStorage.getItem("snake-high-score") || 0);
      let gameOver;

      highScoreEl.textContent = highScore;

      function resetGame() {
        snake = [
          { x: 10, y: 10 },
          { x: 9, y: 10 },
          { x: 8, y: 10 },
        ];
        direction = { x: 1, y: 0 };
        nextDirection = { x: 1, y: 0 };
        food = spawnFood();
        score = 0;
        scoreEl.textContent = score;
        gameOver = false;
      }

      function spawnFood() {
        let point;
        do {
          point = {
            x: Math.floor(Math.random() * gridSize),
            y: Math.floor(Math.random() * gridSize),
          };
        } while (snake?.some((segment) => segment.x === point.x && segment.y === point.y));

        return point;
      }

      function drawRect(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * tileSize, y * tileSize, tileSize - 1, tileSize - 1);
      }

      function drawGame() {
        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        drawRect(food.x, food.y, "#ef4444");

        snake.forEach((segment, index) => {
          drawRect(segment.x, segment.y, index === 0 ? "#22c55e" : "#4ade80");
        });

        if (gameOver) {
          ctx.fillStyle = "rgba(2, 6, 23, 0.75)";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.fillStyle = "#f8fafc";
          ctx.font = "bold 30px Arial";
          ctx.textAlign = "center";
          ctx.fillText("Game Over", canvas.width / 2, canvas.height / 2 - 5);
          ctx.font = "16px Arial";
          ctx.fillText("Press Space to restart", canvas.width / 2, canvas.height / 2 + 24);
        }
      }

      function update() {
        if (gameOver) {
          drawGame();
          return;
        }

        direction = nextDirection;
        const head = {
          x: snake[0].x + direction.x,
          y: snake[0].y + direction.y,
        };

        const hitWall = head.x < 0 || head.y < 0 || head.x >= gridSize || head.y >= gridSize;
        const hitSelf = snake.some((segment) => segment.x === head.x && segment.y === head.y);

        if (hitWall || hitSelf) {
          gameOver = true;
          drawGame();
          return;
        }

        snake.unshift(head);

        if (head.x === food.x && head.y === food.y) {
          score += 10;
          scoreEl.textContent = score;
          if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem("snake-high-score", String(highScore));
          }
          food = spawnFood();
        } else {
          snake.pop();
        }

        drawGame();
      }

      function setDirection(x, y) {
        if (direction.x === -x && direction.y === -y) {
          return;
        }
        nextDirection = { x, y };
      }

      window.addEventListener("keydown", (event) => {
        const key = event.key.toLowerCase();

        if (gameOver && key === " ") {
          resetGame();
          drawGame();
          return;
        }

        if (key === "arrowup" || key === "w") setDirection(0, -1);
        if (key === "arrowdown" || key === "s") setDirection(0, 1);
        if (key === "arrowleft" || key === "a") setDirection(-1, 0);
        if (key === "arrowright" || key === "d") setDirection(1, 0);
      });

      resetGame();
      drawGame();
      setInterval(update, 110);
    </script>
  </body>
</html>
